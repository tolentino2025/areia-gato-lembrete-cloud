name: Lembrete Areia do Gato

# ESTRATEGIA DE PONTUALIDADE
# O gatilho "schedule" do GitHub atrasa de 3h a 9h (medido em 12 dias).
# Por isso cada envio e disparado COM ANTECEDENCIA e o job AGUARDA ate o
# horario alvo antes de enviar:
#   - disparo 02:17 SP (seg) -> escala da semana para todos, 07:00 SP
#   - disparo 03:17 SP       -> lembrete do dia, 08:00 SP
#   - disparo 04:17 SP       -> repeticao, 09:00 SP
#   - disparo 09:17 SP       -> lembrete do dia, 14:00 SP
# Se o GitHub atrasar alem do alvo, envia imediatamente (sem espera).
# Minutos "quebrados" (:17) evitam a fila de pico dos minutos redondos.

on:
  schedule:
    - cron: "17 5 * * 1"    # SEGUNDA 02:17 SP -> escala semanal 07:00 SP (10:00 UTC)
    - cron: "17 6 * * *"    # 03:17 SP -> alvo 08:00 SP (11:00 UTC)
    - cron: "17 7 * * *"    # 04:17 SP -> alvo 09:00 SP (12:00 UTC)
    - cron: "17 12 * * *"   # 09:17 SP -> alvo 14:00 SP (17:00 UTC)
  workflow_dispatch:
    inputs:
      data:
        description: "Data YYYY-MM-DD para escolher o responsavel (vazio = hoje)"
        required: false
        default: ""
      hora:
        description: "Slot de hora SP: 8, 9 ou 14 (vazio = envia sempre)"
        required: false
        default: ""
      escala:
        description: "Marque para enviar a ESCALA DA SEMANA para todos"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aguardar ate o horario alvo
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "17 5 * * 1")  ALVO_UTC=10 ;;   # 07:00 America/Sao_Paulo (segunda)
            "17 6 * * *")  ALVO_UTC=11 ;;   # 08:00 America/Sao_Paulo
            "17 7 * * *")  ALVO_UTC=12 ;;   # 09:00 America/Sao_Paulo
            "17 12 * * *") ALVO_UTC=17 ;;   # 14:00 America/Sao_Paulo
            *) echo "Execucao manual: envia imediatamente."; exit 0 ;;
          esac
          AGORA=$(date -u +%s)
          ALVO=$(date -u -d "today ${ALVO_UTC}:00:00" +%s)
          DIFF=$(( ALVO - AGORA ))
          echo "Agora:  $(date -u) (UTC)"
          echo "Alvo:   ${ALVO_UTC}:00 UTC"
          if [ "$DIFF" -le 0 ]; then
            echo "O GitHub atrasou $(( -DIFF / 60 )) min alem do alvo. Enviando agora."
            exit 0
          fi
          if [ "$DIFF" -gt 18000 ]; then DIFF=18000; fi
          echo "Aguardando ${DIFF}s ($(( DIFF / 60 )) min) ate o horario alvo."
          sleep "$DIFF"

      - name: Enviar
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_PEOPLE: ${{ secrets.WHATSAPP_PEOPLE }}
          WHATSAPP_TEMPLATE_NAME: lembrete_areia_gato
          WHATSAPP_TEMPLATE_ESCALA: escala_semanal_areia_gato
          WHATSAPP_LANGUAGE_CODE: pt_BR
          DATA_INPUT: ${{ inputs.data }}
          HORA_INPUT: ${{ inputs.hora }}
          ESCALA_INPUT: ${{ inputs.escala }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          HORA="$HORA_INPUT"
          ESCALA=""
          case "$SCHEDULE" in
            "17 5 * * 1")  ESCALA="--escala" ;;
            "17 6 * * *")  HORA=8 ;;
            "17 7 * * *")  HORA=9 ;;
            "17 12 * * *") HORA=14 ;;
          esac
          if [ "$ESCALA_INPUT" = "true" ]; then ESCALA="--escala"; HORA=""; fi
          ARGS=""
          if [ -n "$ESCALA" ]; then ARGS="$ARGS $ESCALA"; fi
          if [ -n "$DATA_INPUT" ]; then ARGS="$ARGS --data $DATA_INPUT"; fi
          if [ -n "$HORA" ]; then ARGS="$ARGS --hora $HORA"; fi
          echo "Enviando as $(TZ=America/Sao_Paulo date) - args: '$ARGS'"
          python enviar_areia_gato.py $ARGS

      # Sem commits por 60 dias, o GitHub DESATIVA workflows agendados.
      # Commit automatico nos dias 01 e 15 mantem o repositorio ativo.
      - name: Keepalive (evita desativacao por inatividade)
        if: always()
        run: |
          DIA=$(date -u +%d)
          if [ "$DIA" != "01" ] && [ "$DIA" != "15" ]; then
            echo "Dia $DIA - keepalive nao necessario hoje."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "keepalive: manter workflow agendado ativo" || exit 0
          git push
