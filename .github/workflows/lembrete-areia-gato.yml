name: Lembrete Areia do Gato

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 America/Sao_Paulo (UTC-3)
    - cron: "0 12 * * *"   # 09:00 America/Sao_Paulo (UTC-3)
    - cron: "0 17 * * *"   # 14:00 America/Sao_Paulo (UTC-3)
  workflow_dispatch:
    inputs:
      data:
        description: "Data YYYY-MM-DD para escolher o responsavel (vazio = hoje)"
        required: false
        default: ""
      hora:
        description: "Slot de hora SP: 8, 9 ou 14 (vazio = envia sempre)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar lembrete
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_PEOPLE: ${{ secrets.WHATSAPP_PEOPLE }}
          WHATSAPP_TEMPLATE_NAME: lembrete_areia_gato
          WHATSAPP_LANGUAGE_CODE: pt_BR
          DATA_INPUT: ${{ inputs.data }}
          HORA_INPUT: ${{ inputs.hora }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          HORA="$HORA_INPUT"
          case "$SCHEDULE" in
            "0 11 * * *") HORA=8 ;;
            "0 12 * * *") HORA=9 ;;
            "0 17 * * *") HORA=14 ;;
          esac
          ARGS=""
          if [ -n "$DATA_INPUT" ]; then ARGS="$ARGS --data $DATA_INPUT"; fi
          if [ -n "$HORA" ]; then ARGS="$ARGS --hora $HORA"; fi
          echo "Executando com slot HORA='$HORA' (schedule='$SCHEDULE')"
          python enviar_areia_gato.py $ARGS

      # Sem commits por 60 dias, o GitHub DESATIVA workflows agendados.
      # Este passo faz um commit automatico nos dias 01 e 15 de cada mes,
      # mantendo o repositorio "ativo" para sempre.
      - name: Keepalive (evita desativacao por inatividade)
        if: always()
        run: |
          DIA=$(date -u +%d)
          if [ "$DIA" != "01" ] && [ "$DIA" != "15" ]; then
            echo "Dia $DIA - keepalive nao necessario hoje."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "keepalive: manter workflow agendado ativo" || exit 0
          git push
